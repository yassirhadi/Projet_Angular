<input type="text" aria-label="Nouvelle tâche" placeholder="Nouvelle tâche" [(ngModel)]="newTitle" (keyup.enter)="addFromInput()" />

<p>Nombre de tâches : {{ count() }}</p>

@if (tasks().length === 0) {
  <p class="empty">Aucune tâche pour l’instant</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li>{{ task.title | uppercase }}</li>
    }
  </ul>
}
